name: Build Book Reader APK v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'BookReaderAndroid-ready-v2.zip'
      - '.github/workflows/build-apk-v2.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip Android project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q BookReaderAndroid-ready-v2.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/BookReaderAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp build-src/BookReaderAndroid/app/build/outputs/apk/debug/app-debug.apk out/BookReader-v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BookReader-APK-v2
          path: out/BookReader-v2.apk
          if-no-files-found: error
